name: Translation
description: A wrong, missing or awkward translation
labels: ["translation"]
body:
  - type: input
    id: language
    attributes:
      label: Language
      placeholder: हिन्दी
    validations:
      required: true
  - type: input
    id: page
    attributes:
      label: Page
      placeholder: https://ind-x.vercel.app/hi/compare
  - type: textarea
    id: wrong
    attributes:
      label: What's wrong
      description: The text you see now, and what it should say instead
    validations:
      required: true
